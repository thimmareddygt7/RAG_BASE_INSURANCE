# ============================================================
# Health Insurance RAG: Qdrant (vector DB) + FastAPI
# Usage: cp .env.example .env && docker compose up --build
# ============================================================
name: insurance-rag

services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: insurance-rag-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # bound to localhost only
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insurance-rag-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - RAG_STAGE=${RAG_STAGE:-}
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./eval:/app/eval
      - ./config.yaml:/app/config.yaml:ro
      - hf_cache:/app/.cache/huggingface
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: insurance-rag-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

volumes:
  qdrant_storage:
  hf_cache:
