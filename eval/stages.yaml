# Experiment stages. Each stage adds exactly one change on top of the previous one.
# Keys under `locked` can never be overridden, so every stage is compared fairly.
locked:
  - app
  - llm
  - judge
  - embedding
  - data
  - eval

stages:
  stage2_baseline:
    description: "Vector search only, fixed-size chunks"
    overrides:
      retrieval: {hybrid_search: false, rerank: false}
      ingest: {strategy: fixed}

  stage3_hybrid:
    description: "Add sparse BM25 search fused with reciprocal rank fusion"
    overrides:
      retrieval: {hybrid_search: true, rerank: false}
      ingest: {strategy: fixed}

  stage4_rerank:
    description: "Add cross-encoder reranker"
    overrides:
      retrieval: {hybrid_search: true, rerank: true}
      ingest: {strategy: fixed}

  stage5_structure:
    description: "Structure-aware chunking: split by section, keep tables whole, prepend headings"
    overrides:
      retrieval: {hybrid_search: true, rerank: true}
      ingest: {strategy: structure, keep_tables_whole: true, prepend_heading: true}

  stage6_ocr_tables:
    description: "OCR for scanned pages, PDF table extraction, header/footer cleanup, column order"
    overrides:
      retrieval: {hybrid_search: true, rerank: true}
      ingest: {strategy: structure, keep_tables_whole: true, prepend_heading: true,
               strip_headers_footers: true}
      ocr: {enabled: true}
      tables: {parser: "pymupdf"}
